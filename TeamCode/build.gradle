apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    // Vision (from robotics-personal-repo): keep the TFLite model uncompressed, enable instrumented tests
    androidResources { noCompress += ['tflite'] }
    defaultConfig { testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }

    // The AutoTune tuners need the tuning library, so leave them out unless pedroAutoTune=true
    if (findProperty('pedroAutoTune') != 'true') {
        sourceSets.main.java {
            exclude '**/pedro/Tuning.java'
            exclude '**/pedro/procedures/**'
        }
    }
}

repositories { maven { url = 'https://maven.brott.dev/' } }

dependencies {
    implementation project(':FtcRobotController')

    // Vision (from robotics-personal-repo)
    implementation 'org.tensorflow:tensorflow-lite:2.17.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    // 0.6.0 starts Limelight proxy ports that conflict with Panels.
    implementation('com.acmerobotics.dashboard:dashboard:0.4.16') {
        exclude group: 'org.firstinspires.ftc'
    }
}

apply from: "$rootDir/simloop-starter/simloop.gradle"
